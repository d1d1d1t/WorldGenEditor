<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Road Generator</title>

<style>

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:monospace;
}

#widget{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

#toolbar{

    height:44px;

    background:#1a1a1a;

    border-bottom:1px solid #2b2b2b;

    display:flex;
    align-items:center;
    gap:8px;

    padding:6px;

    box-sizing:border-box;
}

button{

    background:#222;
    color:#ccc;

    border:1px solid #444;

    padding:4px 10px;

    cursor:pointer;

    font-family:monospace;
}

button:hover{
    background:#2f2f2f;
}

#status{

    margin-left:auto;

    color:#777;

    font-size:11px;

    white-space:nowrap;
}

#viewport{

    flex:1;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:auto;

    background:#101010;
}

canvas{

    display:block;

    image-rendering:pixelated;

}

</style>
</head>

<body>

<div id="widget">

    <div id="toolbar">

        <button id="generateBtn">
            Generate Road
        </button>

        <button id="invertBtn">
            Invert: OFF
        </button>

        <button id="exportBtn">
            Export Road
        </button>

        <span id="status">
            rTile 64×32 | p 320×192 | 4p×18p | 1280×3456
        </span>

    </div>

    <div id="viewport">

        <canvas
            id="canvas"
            width="1280"
            height="3456">
        </canvas>

    </div>

</div>


<script type="module">

/*=========================================================
  CANVAS
=========================================================*/

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


/*=========================================================
  CANONICAL METRICS
=========================================================*/

/*
    -------------------------------------------------------
    rTile
    -------------------------------------------------------

    One rTile is:

        64 × 32
*/

const RTILE_WIDTH  = 64;
const RTILE_HEIGHT = 32;


/*
    -------------------------------------------------------
    p
    -------------------------------------------------------

    p contains exactly 30 rTiles:

        5 × 6 = 30
*/

const P_WIDTH  = 320;
const P_HEIGHT = 192;

const P_RTILES_X = 5;
const P_RTILES_Y = 6;


/*
    Sanity check.
*/

if(
    P_RTILES_X * RTILE_WIDTH !== P_WIDTH ||
    P_RTILES_Y * RTILE_HEIGHT !== P_HEIGHT
){
    throw new Error(
        "Invalid p / rTile relationship."
    );
}


/*
    -------------------------------------------------------
    FULL ROAD
    -------------------------------------------------------

        4p × 18p

    Native dimensions:

        20 rTiles × 108 rTiles
*/

const ROAD_P_WIDTH  = 4;
const ROAD_P_HEIGHT = 18;

const ROAD_RTILES_X =
    P_RTILES_X *
    ROAD_P_WIDTH;

const ROAD_RTILES_Y =
    P_RTILES_Y *
    ROAD_P_HEIGHT;


/*
    Pixel dimensions.
*/

const ROAD_WIDTH =
    ROAD_RTILES_X *
    RTILE_WIDTH;

const ROAD_HEIGHT =
    ROAD_RTILES_Y *
    RTILE_HEIGHT;


/*
    Expected:

        20 × 108 rTiles
        1280 × 3456 pixels
*/

if(
    ROAD_RTILES_X !== 20 ||
    ROAD_RTILES_Y !== 108 ||
    ROAD_WIDTH !== 1280 ||
    ROAD_HEIGHT !== 3456
){
    throw new Error(
        "Invalid road footprint."
    );
}


/*=========================================================
  STATE
=========================================================*/

let inverted = false;


/*
    Terrain edge data.

    These values come FROM THE TERRAIN SYSTEM.

    They do not represent a terrain field owned
    by the road generator.

    Each sample corresponds to one native
    terrain/rTile-level position.
*/

let terrainEdges = {

    left:
        createArray(
            ROAD_RTILES_Y,
            128
        ),

    right:
        createArray(
            ROAD_RTILES_Y,
            128
        ),

    top:
        createArray(
            ROAD_RTILES_X,
            128
        ),

    bottom:
        createArray(
            ROAD_RTILES_X,
            128
        )

};


/*
    Native road field.

    One entry = one rTile.

    Nothing below this resolution exists.
*/

let roadField =
    createField(
        ROAD_RTILES_X,
        ROAD_RTILES_Y,
        0
    );


/*
    Transition field.

    Stores the terrain-derived transition
    value at native rTile resolution.
*/

let transitionField =
    createField(
        ROAD_RTILES_X,
        ROAD_RTILES_Y,
        0
    );


/*=========================================================
  FIELD HELPERS
=========================================================*/

function createArray(
    length,
    value = 0
){

    return Array(
        length
    ).fill(value);

}


function createField(
    width,
    height,
    value = 0
){

    return Array.from(
        {
            length:height
        },
        () =>
            Array(
                width
            ).fill(value)
    );

}


/*=========================================================
  VALUE SANITIZATION
=========================================================*/

function clampValue(value){

    value =
        Number(value);

    if(
        !Number.isFinite(value)
    ){
        value = 128;
    }

    return Math.max(
        0,
        Math.min(
            255,
            Math.round(value)
        )
    );

}


/*=========================================================
  EDGE DATA NORMALIZATION
=========================================================*/

function normalizeEdge(
    input,
    expectedLength
){

    const output =
        createArray(
            expectedLength,
            128
        );


    if(
        !Array.isArray(input)
    ){
        return output;
    }


    for(
        let i = 0;
        i < expectedLength;
        i++
    ){

        if(
            i < input.length
        ){

            output[i] =
                clampValue(
                    input[i]
                );

        }

    }


    return output;

}


/*=========================================================
  SET TERRAIN EDGE DATA
=========================================================*/

/*
    The road does NOT request a terrain grid
    covering its own footprint.

    Instead the terrain system supplies the
    terrain immediately bordering the road.

    Expected payload:

    {
        edges:{
            left:   [108 values],
            right:  [108 values],
            top:    [20 values],
            bottom: [20 values]
        }
    }

    One value = one native terrain/rTile-level
    sample.

    No resampling occurs.
*/

function setTerrainEdges(
    edges
){

    if(
        !edges ||
        typeof edges !== "object"
    ){

        console.warn(
            "Road Generator: invalid terrain edge data."
        );

        return false;

    }


    terrainEdges = {

        left:
            normalizeEdge(
                edges.left,
                ROAD_RTILES_Y
            ),

        right:
            normalizeEdge(
                edges.right,
                ROAD_RTILES_Y
            ),

        top:
            normalizeEdge(
                edges.top,
                ROAD_RTILES_X
            ),

        bottom:
            normalizeEdge(
                edges.bottom,
                ROAD_RTILES_X
            )

    };


    generateRoad();

    return true;

}


/*=========================================================
  EDGE ACCESS
=========================================================*/

function getLeftTerrain(y){

    return terrainEdges.left[y];

}


function getRightTerrain(y){

    return terrainEdges.right[y];

}


function getTopTerrain(x){

    return terrainEdges.top[x];

}


function getBottomTerrain(x){

    return terrainEdges.bottom[x];

}


/*=========================================================
  ROAD EDGE PROFILE
=========================================================*/

/*
    Calculate the terrain relationship at one
    longitudinal road row.

    This is native rTile data.

    There is no per-pixel sampling.
*/

function getLongitudinalProfile(y){

    const left =
        getLeftTerrain(y);

    const right =
        getRightTerrain(y);


    const average =
        (
            left +
            right
        ) / 2;


    const difference =
        Math.abs(
            left -
            right
        );


    return {

        left,
        right,
        average,
        difference

    };

}


/*=========================================================
  ROAD TRANSITION
=========================================================*/

/*
    The road footprint itself is 4p wide.

    Terrain transition occurs at the road's
    native outer edge.

    We use rTiles for the transition.

    No smaller unit is introduced.
*/


/*
    Number of native rTiles used by the
    transition on each side.

    One rTile is the minimum possible.
*/

const TRANSITION_RTILES = 1;


/*
    Calculate transition value between:

        adjacent terrain
                  ↓
              road value
*/

function transitionValue(
    terrainValue,
    roadValue,
    distance
){

    /*
        distance is native rTile distance.

        0 = boundary
        1 = next native unit
    */

    const factor =
        Math.max(
            0,
            Math.min(
                1,
                1 -
                (
                    distance /
                    (
                        TRANSITION_RTILES + 1
                    )
                )
            )
        );


    return Math.round(

        terrainValue +
        (
            roadValue -
            terrainValue
        ) *
        factor

    );

}


/*=========================================================
  ROAD CARVING
=========================================================*/

/*
    This function creates the native road field.

    Important:

    The road does not fabricate terrain beneath
    itself.

    It uses terrain edge values to determine
    the boundary transition.

    Interior road rTiles are road values.

    Edge rTiles receive carved transition values.
*/

function carveRoad(){

    /*
        Base road value.

        White represents maximum road density.
    */

    const roadValue =
        inverted
            ? 0
            : 255;


    /*
        Clear previous fields.
    */

    roadField =
        createField(
            ROAD_RTILES_X,
            ROAD_RTILES_Y,
            0
        );

    transitionField =
        createField(
            ROAD_RTILES_X,
            ROAD_RTILES_Y,
            0
        );


    /*
        ---------------------------------------------------
        MAIN ROAD FIELD
        ---------------------------------------------------

        The complete 4p × 18p footprint is
        represented by native rTiles.
    */

    for(
        let y = 0;
        y < ROAD_RTILES_Y;
        y++
    ){

        const leftTerrain =
            getLeftTerrain(y);

        const rightTerrain =
            getRightTerrain(y);


        for(
            let x = 0;
            x < ROAD_RTILES_X;
            x++
        ){

            /*
                Interior road.
            */

            let value =
                roadValue;


            /*
                ------------------------------------------------
                LEFT EDGE
                ------------------------------------------------

                The first native rTile on the road's
                left boundary transitions from the
                adjacent left terrain.
            */

            if(
                x === 0
            ){

                value =
                    transitionValue(
                        leftTerrain,
                        roadValue,
                        0
                    );

                transitionField[y][x] =
                    value;

            }


            /*
                ------------------------------------------------
                RIGHT EDGE
                ------------------------------------------------
            */

            else if(
                x === ROAD_RTILES_X - 1
            ){

                value =
                    transitionValue(
                        rightTerrain,
                        roadValue,
                        0
                    );

                transitionField[y][x] =
                    value;

            }


            /*
                Interior remains road.
            */

            else{

                transitionField[y][x] =
                    roadValue;

            }


            roadField[y][x] =
                value;

        }

    }


    /*
        ---------------------------------------------------
        END TRANSITIONS
        ---------------------------------------------------

        The road has two short ends.

        Use top/bottom terrain edge data there.
    */

    for(
        let x = 0;
        x < ROAD_RTILES_X;
        x++
    ){

        const topTerrain =
            getTopTerrain(x);

        const bottomTerrain =
            getBottomTerrain(x);


        /*
            Top boundary.
        */

        roadField[0][x] =
            transitionValue(
                topTerrain,
                roadValue,
                0
            );

        transitionField[0][x] =
            roadField[0][x];


        /*
            Bottom boundary.
        */

        roadField[
            ROAD_RTILES_Y - 1
        ][x] =
            transitionValue(
                bottomTerrain,
                roadValue,
                0
            );

        transitionField[
            ROAD_RTILES_Y - 1
        ][x] =
            roadField[
                ROAD_RTILES_Y - 1
            ][x];

    }

}


/*=========================================================
  GENERATE
=========================================================*/

function generateRoad(){

    carveRoad();

    render();

}


/*=========================================================
  RENDER
=========================================================*/

/*
    Each rendered rectangle corresponds
    to exactly one rTile.

        rTile = 64 × 32

    The canvas therefore represents:

        20 × 108 native rTiles

        1280 × 3456 pixels
*/

function render(){

    ctx.clearRect(
        0,
        0,
        ROAD_WIDTH,
        ROAD_HEIGHT
    );


    for(
        let y = 0;
        y < ROAD_RTILES_Y;
        y++
    ){

        for(
            let x = 0;
            x < ROAD_RTILES_X;
            x++
        ){

            const value =
                roadField[y][x];


            ctx.fillStyle =
                `rgb(${value},${value},${value})`;


            ctx.fillRect(

                x * RTILE_WIDTH,
                y * RTILE_HEIGHT,

                RTILE_WIDTH,
                RTILE_HEIGHT

            );

        }

    }

}


/*=========================================================
  INVERT
=========================================================*/

document
.getElementById("invertBtn")
.onclick = () => {

    inverted =
        !inverted;


    document
    .getElementById("invertBtn")
    .textContent =
        inverted
            ? "Invert: ON"
            : "Invert: OFF";


    generateRoad();

};


/*=========================================================
  GENERATE BUTTON
=========================================================*/

document
.getElementById("generateBtn")
.onclick =
    generateRoad;


/*=========================================================
  EXPORT
=========================================================*/

function exportRoad(){

    /*
        Standalone road export.

        Exact dimensions:

            1280 × 3456

        This is the actual 4p × 18p
        road footprint.
    */

    const link =
        document.createElement("a");


    link.download =
        "road_4p_x_18p_1280x3456.png";


    link.href =
        canvas.toDataURL(
            "image/png"
        );


    link.click();

}


document
.getElementById("exportBtn")
.onclick =
    exportRoad;


/*=========================================================
  HUB MESSAGE HANDLING
=========================================================*/

window.addEventListener(
    "message",
    (e) => {

        const msg =
            e.data;


        if(!msg){
            return;
        }


        switch(msg.type){

            /*=============================================
              TERRAIN EDGE DATA
            =============================================*/

            case "SET_TERRAIN":

                /*
                    Preferred form:

                    payload:{
                        edges:{
                            left:[],
                            right:[],
                            top:[],
                            bottom:[]
                        }
                    }
                */

                if(
                    msg.payload?.edges
                ){

                    setTerrainEdges(
                        msg.payload.edges
                    );

                }

                /*
                    Also allow direct:

                    payload:{
                        left:[],
                        right:[],
                        top:[],
                        bottom:[]
                    }
                */

                else if(
                    msg.payload?.left ||
                    msg.payload?.right ||
                    msg.payload?.top ||
                    msg.payload?.bottom
                ){

                    setTerrainEdges(
                        msg.payload
                    );

                }

                break;


            /*=============================================
              GENERATE
            =============================================*/

            case "GENERATE":

                generateRoad();

                break;


            /*=============================================
              EXPORT
            =============================================*/

            case "EXPORT":

                exportRoad();

                break;

        }

    }
);


/*=========================================================
  INITIALIZATION
=========================================================*/

generateRoad();


console.log(
    "Road Generator Ready"
);

console.log(
    "rTile:",
    `${RTILE_WIDTH} × ${RTILE_HEIGHT}`
);

console.log(
    "p:",
    `${P_WIDTH} × ${P_HEIGHT}`
);

console.log(
    "p composition:",
    `${P_RTILES_X} × ${P_RTILES_Y} rTiles`
);

console.log(
    "Road:",
    `${ROAD_P_WIDTH}p × ${ROAD_P_HEIGHT}p`
);

console.log(
    "Native road field:",
    `${ROAD_RTILES_X} × ${ROAD_RTILES_Y} rTiles`
);

console.log(
    "Export:",
    `${ROAD_WIDTH} × ${ROAD_HEIGHT}`
);

</script>

</body>
</html>
