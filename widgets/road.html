<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Road Generator</title>

<style>

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:monospace;
}

#widget{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

/*=========================================================
  TOOLBAR
=========================================================*/

#toolbar{

    height:44px;

    background:#1a1a1a;

    border-bottom:1px solid #2b2b2b;

    display:flex;

    align-items:center;

    gap:8px;

    padding:6px;

    box-sizing:border-box;

}

button{

    background:#222;

    color:#ccc;

    border:1px solid #444;

    padding:4px 10px;

    cursor:pointer;

    font-family:monospace;

}

button:hover{
    background:#2f2f2f;
}

#status{

    margin-left:auto;

    color:#777;

    font-size:11px;

    white-space:nowrap;

}

/*=========================================================
  VIEWPORT
=========================================================*/

#viewport{

    flex:1;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:auto;

    background:#101010;

}

canvas{

    display:block;

    image-rendering:pixelated;

}

</style>
</head>

<body>

<div id="widget">

    <div id="toolbar">

        <button id="generateBtn">
            Generate Road
        </button>

        <button id="invertBtn">
            Invert: OFF
        </button>

        <button id="exportBtn">
            Export Height
        </button>

        <span id="status">
            rTile 64×32 | p 320×192 | 4p×18p | 1280×3456
        </span>

    </div>

    <div id="viewport">

        <canvas
            id="canvas"
            width="1280"
            height="3456">
        </canvas>

    </div>

</div>


<script type="module">

/*=========================================================
  CANVAS
=========================================================*/

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


/*=========================================================
  CANONICAL METRICS
=========================================================*/

/*
    rTile
    -------------------------------------------------------

    Fundamental road carving unit.

        64 × 32
*/

const RTILE_WIDTH  = 64;
const RTILE_HEIGHT = 32;


/*
    p
    -------------------------------------------------------

        320 × 192

    Composition:

        5 rTiles × 6 rTiles

        5 × 6 = 30 rTiles
*/

const P_WIDTH  = 320;
const P_HEIGHT = 192;

const P_RTILES_X = 5;
const P_RTILES_Y = 6;


/*
    Full road:

        4p × 18p
*/

const ROAD_P_WIDTH  = 4;
const ROAD_P_HEIGHT = 18;


/*
    Native road dimensions:

        4 × 5 = 20 rTiles
        18 × 6 = 108 rTiles
*/

const ROAD_RTILES_X =
    ROAD_P_WIDTH *
    P_RTILES_X;

const ROAD_RTILES_Y =
    ROAD_P_HEIGHT *
    P_RTILES_Y;


/*
    Final dimensions:

        20 × 64  = 1280
        108 × 32 = 3456
*/

const ROAD_WIDTH =
    ROAD_RTILES_X *
    RTILE_WIDTH;

const ROAD_HEIGHT =
    ROAD_RTILES_Y *
    RTILE_HEIGHT;


/*
    Sanity checks.
*/

if(
    P_WIDTH !== 320 ||
    P_HEIGHT !== 192 ||

    P_RTILES_X !== 5 ||
    P_RTILES_Y !== 6 ||

    ROAD_RTILES_X !== 20 ||
    ROAD_RTILES_Y !== 108 ||

    ROAD_WIDTH !== 1280 ||
    ROAD_HEIGHT !== 3456
){

    throw new Error(
        "Road metric configuration is invalid."
    );

}


/*=========================================================
  STATE
=========================================================*/

let inverted = false;


/*
    -------------------------------------------------------
    INPUT HEIGHT FIELD
    -------------------------------------------------------

    This is the terrain height field belonging
    to the road footprint.

    Resolution:

        20 × 108 rTiles

    One element = one rTile.

    The road does NOT generate this field.
*/

let sourceHeight =
    createField(
        ROAD_RTILES_X,
        ROAD_RTILES_Y,
        128
    );


/*
    -------------------------------------------------------
    OUTPUT HEIGHT FIELD
    -------------------------------------------------------

    This begins as a copy of sourceHeight.

    Road carving modifies this field.

    It is never replaced by a constant
    road color.
*/

let outputHeight =
    createField(
        ROAD_RTILES_X,
        ROAD_RTILES_Y,
        128
    );


/*
    -------------------------------------------------------
    TERRAIN EDGE DATA
    -------------------------------------------------------

    Terrain immediately outside the road
    footprint.

    These are NOT the road's terrain field.

    They describe the surrounding terrain.

        left   = 108 samples
        right  = 108 samples
        top    = 20 samples
        bottom = 20 samples
*/

let terrainEdges = {

    left:
        createArray(
            ROAD_RTILES_Y,
            128
        ),

    right:
        createArray(
            ROAD_RTILES_Y,
            128
        ),

    top:
        createArray(
            ROAD_RTILES_X,
            128
        ),

    bottom:
        createArray(
            ROAD_RTILES_X,
            128
        )

};


/*=========================================================
  FIELD HELPERS
=========================================================*/

function createArray(
    length,
    value = 0
){

    return Array(
        length
    ).fill(value);

}


function createField(
    width,
    height,
    value = 0
){

    return Array.from(
        {
            length:height
        },
        () =>
            Array(
                width
            ).fill(value)
    );

}


/*=========================================================
  VALUE CONTROL
=========================================================*/

function clampHeight(value){

    value =
        Number(value);

    if(
        !Number.isFinite(value)
    ){

        value = 128;

    }

    return Math.max(
        0,
        Math.min(
            255,
            Math.round(value)
        )
    );

}


/*=========================================================
  COPY HEIGHT FIELD
=========================================================*/

function cloneField(field){

    return field.map(
        row =>
            row.map(
                value =>
                    clampHeight(value)
            )
    );

}


/*=========================================================
  NORMALIZE FIELD
=========================================================*/

function normalizeHeightField(
    field
){

    if(
        !Array.isArray(field)
    ){

        return null;

    }

    if(
        field.length !==
        ROAD_RTILES_Y
    ){

        return null;

    }

    for(
        let y = 0;
        y < ROAD_RTILES_Y;
        y++
    ){

        if(
            !Array.isArray(field[y]) ||
            field[y].length !==
            ROAD_RTILES_X
        ){

            return null;

        }

    }


    return field.map(
        row =>
            row.map(
                value =>
                    clampHeight(value)
            )
    );

}


/*=========================================================
  NORMALIZE EDGE
=========================================================*/

function normalizeEdge(
    input,
    length
){

    const output =
        createArray(
            length,
            128
        );


    if(
        !Array.isArray(input)
    ){

        return output;

    }


    for(
        let i = 0;
        i < length;
        i++
    ){

        if(
            i < input.length
        ){

            output[i] =
                clampHeight(
                    input[i]
                );

        }

    }


    return output;

}


/*=========================================================
  TERRAIN INPUT
=========================================================*/

/*
    Expected:

    {
        height: [
            108 rows × 20 values
        ],

        edges:{
            left:   108 values,
            right:  108 values,
            top:    20 values,
            bottom: 20 values
        }
    }

    The height field is the terrain occupying
    the road footprint.

    The edge arrays are the terrain surrounding
    the road footprint.
*/

function setTerrainData(
    payload
){

    if(
        !payload ||
        typeof payload !== "object"
    ){

        return false;

    }


    /*
        -----------------------------------------------
        HEIGHT FIELD
        -----------------------------------------------
    */

    const height =
        normalizeHeightField(
            payload.height
        );


    if(!height){

        console.warn(
            "Road Generator: invalid height field. " +
            "Expected 20 × 108 native rTiles."
        );

        return false;

    }


    /*
        -----------------------------------------------
        EDGE FIELD
        -----------------------------------------------
    */

    const edges =
        payload.edges || {};


    sourceHeight =
        height;


    terrainEdges = {

        left:
            normalizeEdge(
                edges.left,
                ROAD_RTILES_Y
            ),

        right:
            normalizeEdge(
                edges.right,
                ROAD_RTILES_Y
            ),

        top:
            normalizeEdge(
                edges.top,
                ROAD_RTILES_X
            ),

        bottom:
            normalizeEdge(
                edges.bottom,
                ROAD_RTILES_X
            )

    };


    generateRoad();

    return true;

}


/*=========================================================
  TERRAIN EDGE ACCESS
=========================================================*/

function leftTerrain(y){

    return terrainEdges.left[y];

}


function rightTerrain(y){

    return terrainEdges.right[y];

}


function topTerrain(x){

    return terrainEdges.top[x];

}


function bottomTerrain(x){

    return terrainEdges.bottom[x];

}


/*=========================================================
  ROAD CARVING PARAMETERS
=========================================================*/

/*
    These are HEIGHT adjustments.

    They are not display colors.

    They operate directly on the source
    height field.

    Positive = raise
    Negative = lower
*/


/*
    Maximum amount by which the road seeks
    to flatten an rTile toward its local
    road target.

    Kept deliberately moderate so that
    terrain variation remains visible.
*/

const ROAD_CARVE_STRENGTH = 0.50;


/*
    The road surface is derived from the
    terrain surrounding the road.

    This prevents the road from becoming
    an arbitrary white strip.
*/

const EDGE_BLEND = 0.50;


/*=========================================================
  ROAD TARGET HEIGHT
=========================================================*/

/*
    Determine the target road height for
    each longitudinal row.

    The road is influenced by both sides.

    This produces a natural transition
    rather than a fixed 255 value.
*/

function calculateRoadTarget(y){

    const left =
        leftTerrain(y);

    const right =
        rightTerrain(y);


    /*
        Center target between both
        adjacent terrain heights.
    */

    let target =
        (
            left +
            right
        ) / 2;


    /*
        Blend with the actual terrain
        at the center of the road.

        This keeps the road coupled to
        the existing height field.
    */

    const centerX =
        Math.floor(
            ROAD_RTILES_X / 2
        );


    const centerTerrain =
        sourceHeight[y][centerX];


    target =
        (
            target *
            EDGE_BLEND
        ) +
        (
            centerTerrain *
            (1 - EDGE_BLEND)
        );


    return clampHeight(
        target
    );

}


/*=========================================================
  HEIGHT CARVING
=========================================================*/

/*
    IMPORTANT:

    This is where the previous implementation
    was wrong.

    We DO NOT write 255 into the road.

    Instead:

        source terrain
              ↓
        local road target
              ↓
        controlled rTile-level adjustment
              ↓
        output terrain

    Existing height variation remains.
*/

function carveHeightField(){

    /*
        Start with the actual terrain.

        This guarantees that all terrain
        information is preserved unless a
        road carving operation changes it.
    */

    outputHeight =
        cloneField(
            sourceHeight
        );


    for(
        let y = 0;
        y < ROAD_RTILES_Y;
        y++
    ){

        const target =
            calculateRoadTarget(y);


        /*
            Determine the terrain heights
            at the road's two external edges.
        */

        const leftEdge =
            leftTerrain(y);

        const rightEdge =
            rightTerrain(y);


        for(
            let x = 0;
            x < ROAD_RTILES_X;
            x++
        ){

            const current =
                sourceHeight[y][x];


            /*
                ------------------------------------------------
                DISTANCE FROM ROAD CENTER
                ------------------------------------------------
            */

            const center =
                (
                    ROAD_RTILES_X - 1
                ) / 2;


            const distance =
                Math.abs(
                    x - center
                );


            const normalizedDistance =
                distance /
                center;


            /*
                Interior of road receives stronger
                flattening.

                Outer edges receive less.
            */

            const roadInfluence =
                Math.max(
                    0,
                    1 -
                    normalizedDistance
                );


            /*
                -----------------------------------------------
                EDGE-SPECIFIC INFLUENCE
                -----------------------------------------------

                Left side gradually approaches the
                left terrain value.

                Right side gradually approaches the
                right terrain value.
            */

            let edgeTarget;


            if(
                x <= center
            ){

                const sideFactor =
                    x / center;

                edgeTarget =
                    leftEdge +
                    (
                        target -
                        leftEdge
                    ) *
                    sideFactor;

            }
            else{

                const sideFactor =
                    (
                        ROAD_RTILES_X - 1 - x
                    ) /
                    center;

                edgeTarget =
                    rightEdge +
                    (
                        target -
                        rightEdge
                    ) *
                    sideFactor;

            }


            /*
                Combine the road target and
                edge target.
            */

            const desired =
                (
                    target *
                    roadInfluence
                ) +
                (
                    edgeTarget *
                    (
                        1 -
                        roadInfluence
                    )
                );


            /*
                Controlled modification.

                The original terrain remains
                visible because only a portion
                of the difference is applied.
            */

            let result =
                current +
                (
                    desired -
                    current
                ) *
                ROAD_CARVE_STRENGTH;


            /*
                Invert changes the height
                relationship only when explicitly
                requested.
            */

            if(inverted){

                result =
                    255 - result;

            }


            outputHeight[y][x] =
                clampHeight(
                    result
                );

        }

    }


    /*
        ---------------------------------------------------
        TOP / BOTTOM EDGE TRANSITIONS
        ---------------------------------------------------

        These use the actual surrounding terrain
        values rather than a fixed white value.
    */

    applyEndTransitions();

}


/*=========================================================
  END TRANSITIONS
=========================================================*/

function applyEndTransitions(){

    const topRows =
        1;

    const bottomRows =
        1;


    /*
        TOP
    */

    for(
        let x = 0;
        x < ROAD_RTILES_X;
        x++
    ){

        const terrainValue =
            topTerrain(x);


        const current =
            outputHeight[0][x];


        outputHeight[0][x] =
            clampHeight(

                (
                    current +
                    terrainValue
                ) / 2

            );

    }


    /*
        BOTTOM
    */

    for(
        let x = 0;
        x < ROAD_RTILES_X;
        x++
    ){

        const row =
            ROAD_RTILES_Y -
            bottomRows;


        const terrainValue =
            bottomTerrain(x);


        const current =
            outputHeight[row][x];


        outputHeight[row][x] =
            clampHeight(

                (
                    current +
                    terrainValue
                ) / 2

            );

    }

}


/*=========================================================
  GENERATE
=========================================================*/

function generateRoad(){

    /*
        Always begin from source terrain.

        This prevents repeated Generate operations
        from progressively modifying the previous
        result.
    */

    carveHeightField();

    render();

}


/*=========================================================
  RENDER
=========================================================*/

/*
    The canvas is a direct representation
    of the resulting native height field.

    One rTile:

        64 × 32 pixels

    One field:

        20 × 108 rTiles

    Result:

        1280 × 3456
*/

function render(){

    ctx.clearRect(
        0,
        0,
        ROAD_WIDTH,
        ROAD_HEIGHT
    );


    for(
        let y = 0;
        y < ROAD_RTILES_Y;
        y++
    ){

        for(
            let x = 0;
            x < ROAD_RTILES_X;
            x++
        ){

            const value =
                outputHeight[y][x];


            ctx.fillStyle =
                `rgb(${value},${value},${value})`;


            ctx.fillRect(

                x * RTILE_WIDTH,
                y * RTILE_HEIGHT,

                RTILE_WIDTH,
                RTILE_HEIGHT

            );

        }

    }

}


/*=========================================================
  INVERT
=========================================================*/

document
.getElementById("invertBtn")
.onclick = () => {

    inverted =
        !inverted;


    document
    .getElementById("invertBtn")
    .textContent =
        inverted
            ? "Invert: ON"
            : "Invert: OFF";


    generateRoad();

};


/*=========================================================
  GENERATE BUTTON
=========================================================*/

document
.getElementById("generateBtn")
.onclick =
    generateRoad;


/*=========================================================
  EXPORT
=========================================================*/

function exportRoad(){

    /*
        Export the RESULTING HEIGHT FIELD.

        Not a road mask.
        Not a white road.

        Exact dimensions:

            1280 × 3456
    */

    const link =
        document.createElement("a");


    link.download =
        "road_height_4p_x_18p_1280x3456.png";


    link.href =
        canvas.toDataURL(
            "image/png"
        );


    link.click();

}


document
.getElementById("exportBtn")
.onclick =
    exportRoad;


/*=========================================================
  HUB MESSAGES
=========================================================*/

window.addEventListener(
    "message",
    (e) => {

        const msg =
            e.data;


        if(!msg){
            return;
        }


        switch(msg.type){

            /*=============================================
              SET TERRAIN
            =============================================*/

            case "SET_TERRAIN":

                if(
                    msg.payload
                ){

                    setTerrainData(
                        msg.payload
                    );

                }

                break;


            /*=============================================
              GENERATE
            =============================================*/

            case "GENERATE":

                generateRoad();

                break;


            /*=============================================
              EXPORT
            =============================================*/

            case "EXPORT":

                exportRoad();

                break;

        }

    }
);


/*=========================================================
  DEFAULT TEST TERRAIN
=========================================================*/

/*
    This is ONLY a standalone fallback so the widget
    displays height variation before the master editor
    sends real terrain data.

    It is still native rTile resolution.

    No sub-rTile data is generated.
*/

function createTestTerrain(){

    const field =
        createField(
            ROAD_RTILES_X,
            ROAD_RTILES_Y,
            128
        );


    for(
        let y = 0;
        y < ROAD_RTILES_Y;
        y++
    ){

        for(
            let x = 0;
            x < ROAD_RTILES_X;
            x++
        ){

            /*
                Broad terrain variation.

                This is intentionally low-frequency
                because each cell is one native rTile.
            */

            const broad =
                Math.sin(
                    y * 0.11
                ) * 22;


            const cross =
                Math.sin(
                    x * 0.30
                ) * 10;


            field[y][x] =
                clampHeight(
                    128 +
                    broad +
                    cross
                );

        }

    }


    return field;

}


/*
    Generate a visible native-resolution
    test field only when no terrain has
    yet been supplied.
*/

sourceHeight =
    createTestTerrain();


/*
    Generate corresponding default
    surrounding edges.
*/

for(
    let y = 0;
    y < ROAD_RTILES_Y;
    y++
){

    terrainEdges.left[y] =
        sourceHeight[y][0];

    terrainEdges.right[y] =
        sourceHeight[y][
            ROAD_RTILES_X - 1
        ];

}


for(
    let x = 0;
    x < ROAD_RTILES_X;
    x++
){

    terrainEdges.top[x] =
        sourceHeight[0][x];

    terrainEdges.bottom[x] =
        sourceHeight[
            ROAD_RTILES_Y - 1
        ][x];

}


/*=========================================================
  INITIALIZE
=========================================================*/

generateRoad();


/*=========================================================
  DEBUG
=========================================================*/

console.log(
    "Road Height Generator Ready"
);

console.log(
    "rTile:",
    `${RTILE_WIDTH} × ${RTILE_HEIGHT}`
);

console.log(
    "p:",
    `${P_WIDTH} × ${P_HEIGHT}`
);

console.log(
    "p composition:",
    `${P_RTILES_X} × ${P_RTILES_Y} rTiles`
);

console.log(
    "Road:",
    `${ROAD_P_WIDTH}p × ${ROAD_P_HEIGHT}p`
);

console.log(
    "Native road field:",
    `${ROAD_RTILES_X} × ${ROAD_RTILES_Y} rTiles`
);

console.log(
    "Export:",
    `${ROAD_WIDTH} × ${ROAD_HEIGHT}`
);

</script>

</body>
</html>
