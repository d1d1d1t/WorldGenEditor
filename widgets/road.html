<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Road Generator</title>

<style>

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:monospace;
}

#widget{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

/*=========================================================
  TOOLBAR
=========================================================*/

#toolbar{

    height:44px;

    background:#1a1a1a;

    border-bottom:1px solid #2b2b2b;

    display:flex;
    align-items:center;

    gap:8px;

    padding:6px;

    box-sizing:border-box;

}

button{

    background:#222;

    color:#ccc;

    border:1px solid #444;

    padding:4px 10px;

    cursor:pointer;

    font-family:monospace;

}

button:hover{
    background:#2f2f2f;
}

#status{

    margin-left:auto;

    color:#777;

    font-size:11px;

    white-space:nowrap;

}

/*=========================================================
  VIEWPORT
=========================================================*/

#viewport{

    flex:1;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:auto;

    background:#101010;

}

canvas{

    display:block;

    image-rendering:pixelated;

}

</style>
</head>

<body>

<div id="widget">

    <div id="toolbar">

        <button id="generateBtn">
            Generate Road
        </button>

        <button id="invertBtn">
            Invert: OFF
        </button>

        <button id="exportBtn">
            Export Road
        </button>

        <span id="status">
            rTile 64×32 | Road 16×60 rTiles | 1024×1920
        </span>

    </div>

    <div id="viewport">

        <canvas
            id="canvas"
            width="1024"
            height="1920">
        </canvas>

    </div>

</div>


<script type="module">

/*=========================================================
  CANVAS
=========================================================*/

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


/*=========================================================
  CANONICAL METRICS
=========================================================*/

/*
    Fundamental road unit.

        rTile = 64 × 32
*/

const RTILE_WIDTH  = 64;
const RTILE_HEIGHT = 32;


/*
    Fundamental p.

        p = 320 × 192

    p contains:

        5 × 6 rTiles
        = 30 rTiles
*/

const P_WIDTH  = 320;
const P_HEIGHT = 192;

const P_RTILES_X = 5;
const P_RTILES_Y = 6;


/*=========================================================
  ROAD GENERATOR USABLE SPACE
=========================================================*/

/*
    The Road Generator operates on a fixed
    usable footprint:

        1024 × 1920

    At the canonical rTile resolution:

        1024 / 64 = 16 rTiles
        1920 / 32 = 60 rTiles

    Therefore:

        16 × 60 rTiles
*/

const ROAD_WIDTH =
    1024;

const ROAD_HEIGHT =
    1920;

const ROAD_RTILES_X =
    ROAD_WIDTH /
    RTILE_WIDTH;

const ROAD_RTILES_Y =
    ROAD_HEIGHT /
    RTILE_HEIGHT;


/*
    Verify that the usable space is exactly
    representable by whole rTiles.
*/

if(
    ROAD_RTILES_X !== 16 ||
    ROAD_RTILES_Y !== 60
){

    throw new Error(
        "Road Generator footprint does not align to rTile resolution."
    );

}


/*=========================================================
  STATE
=========================================================*/

let inverted = false;


/*=========================================================
  TERRAIN HEIGHT FIELD
=========================================================*/

/*
    Source terrain.

    This is NOT generated by the road.

    It is supplied by the terrain system.

    Native resolution:

        16 × 60 rTiles

    One value represents one native rTile.
*/

let sourceHeight =
    createField(
        ROAD_RTILES_X,
        ROAD_RTILES_Y,
        128
    );


/*
    Resulting height field.

    Road carving modifies a copy of
    sourceHeight.

    The original terrain is never destroyed.
*/

let outputHeight =
    createField(
        ROAD_RTILES_X,
        ROAD_RTILES_Y,
        128
    );


/*=========================================================
  TERRAIN EDGE DATA
=========================================================*/

/*
    Terrain immediately outside the usable
    Road Generator footprint.

    Native edge sampling:

        left   = 60 samples
        right  = 60 samples

        top    = 16 samples
        bottom = 16 samples

    No smaller sampling unit is introduced.
*/

let terrainEdges = {

    left:
        createArray(
            ROAD_RTILES_Y,
            128
        ),

    right:
        createArray(
            ROAD_RTILES_Y,
            128
        ),

    top:
        createArray(
            ROAD_RTILES_X,
            128
        ),

    bottom:
        createArray(
            ROAD_RTILES_X,
            128
        )

};


/*=========================================================
  FIELD HELPERS
=========================================================*/

function createArray(
    length,
    value = 0
){

    return Array(
        length
    ).fill(value);

}


function createField(
    width,
    height,
    value = 0
){

    return Array.from(
        {
            length:height
        },
        () =>
            Array(
                width
            ).fill(value)
    );

}


/*=========================================================
  VALUE HELPERS
=========================================================*/

function clampHeight(value){

    value =
        Number(value);

    if(
        !Number.isFinite(value)
    ){

        value = 128;

    }

    return Math.max(
        0,
        Math.min(
            255,
            Math.round(value)
        )
    );

}


function cloneField(field){

    return field.map(
        row =>
            row.map(
                value =>
                    clampHeight(value)
            )
    );

}


/*=========================================================
  NORMALIZE HEIGHT FIELD
=========================================================*/

function normalizeHeightField(
    field
){

    if(
        !Array.isArray(field)
    ){

        return null;

    }


    /*
        Only the usable 16 × 60 rTile
        footprint is accepted.

        Anything beyond it is clipped.
    */

    const result =
        createField(
            ROAD_RTILES_X,
            ROAD_RTILES_Y,
            128
        );


    for(
        let y = 0;
        y < ROAD_RTILES_Y;
        y++
    ){

        if(
            !Array.isArray(field[y])
        ){

            continue;

        }


        for(
            let x = 0;
            x < ROAD_RTILES_X;
            x++
        ){

            if(
                x < field[y].length
            ){

                result[y][x] =
                    clampHeight(
                        field[y][x]
                    );

            }

        }

    }


    return result;

}


/*=========================================================
  NORMALIZE EDGE
=========================================================*/

function normalizeEdge(
    input,
    length
){

    const result =
        createArray(
            length,
            128
        );


    if(
        !Array.isArray(input)
    ){

        return result;

    }


    /*
        Anything beyond the usable edge
        is intentionally ignored.
    */

    for(
        let i = 0;
        i < length;
        i++
    ){

        if(
            i < input.length
        ){

            result[i] =
                clampHeight(
                    input[i]
                );

        }

    }


    return result;

}


/*=========================================================
  TERRAIN INPUT
=========================================================*/

/*
    Expected message:

    {
        type:"SET_TERRAIN",

        payload:{

            height:[
                60 rows × 16 values
            ],

            edges:{

                left:   [60],
                right:  [60],
                top:    [16],
                bottom: [16]

            }

        }

    }

    The road only consumes the native usable
    footprint.

    Anything outside the footprint is clipped.
*/

function setTerrainData(
    payload
){

    if(
        !payload ||
        typeof payload !== "object"
    ){

        return false;

    }


    const height =
        normalizeHeightField(
            payload.height
        );


    if(!height){

        console.warn(
            "Road Generator: invalid terrain height data."
        );

        return false;

    }


    const edges =
        payload.edges || {};


    sourceHeight =
        height;


    terrainEdges = {

        left:
            normalizeEdge(
                edges.left,
                ROAD_RTILES_Y
            ),

        right:
            normalizeEdge(
                edges.right,
                ROAD_RTILES_Y
            ),

        top:
            normalizeEdge(
                edges.top,
                ROAD_RTILES_X
            ),

        bottom:
            normalizeEdge(
                edges.bottom,
                ROAD_RTILES_X
            )

    };


    generateRoad();

    return true;

}


/*=========================================================
  EDGE ACCESS
=========================================================*/

function getLeftTerrain(y){

    return terrainEdges.left[y];

}


function getRightTerrain(y){

    return terrainEdges.right[y];

}


function getTopTerrain(x){

    return terrainEdges.top[x];

}


function getBottomTerrain(x){

    return terrainEdges.bottom[x];

}


/*=========================================================
  ROAD HEIGHT MODEL
=========================================================*/

/*
    The road is a modification of the terrain
    height field.

    It is NOT a white mask.

    Existing terrain variation remains visible.
*/


/*
    Amount of local terrain modification.

    0 = preserve terrain completely
    1 = fully apply road target

    This remains an rTile-level operation.
*/

const ROAD_CARVE_STRENGTH =
    0.50;


/*
    How strongly the adjacent terrain
    influences the road center target.
*/

const EDGE_INFLUENCE =
    0.50;


/*=========================================================
  ROAD TARGET
=========================================================*/

function calculateRoadTarget(y){

    const left =
        getLeftTerrain(y);

    const right =
        getRightTerrain(y);


    /*
        Terrain height implied by the
        two adjacent sides.
    */

    const edgeAverage =
        (
            left +
            right
        ) / 2;


    /*
        Existing center terrain.

        Since the road field itself is
        terrain-derived, preserve this
        information.
    */

    const centerX =
        Math.floor(
            ROAD_RTILES_X / 2
        );


    const centerTerrain =
        sourceHeight[y][centerX];


    /*
        Combine surrounding terrain with
        terrain already occupying the road
        footprint.
    */

    const target =
        (
            edgeAverage *
            EDGE_INFLUENCE
        ) +
        (
            centerTerrain *
            (
                1 -
                EDGE_INFLUENCE
            )
        );


    return clampHeight(
        target
    );

}


/*=========================================================
  ROAD CARVING
=========================================================*/

function carveRoad(){

    /*
        Always start from original terrain.

        This prevents repeated generation from
        accumulating modifications.
    */

    outputHeight =
        cloneField(
            sourceHeight
        );


    for(
        let y = 0;
        y < ROAD_RTILES_Y;
        y++
    ){

        const left =
            getLeftTerrain(y);

        const right =
            getRightTerrain(y);


        const roadTarget =
            calculateRoadTarget(y);


        /*
            Center coordinate in native rTiles.
        */

        const center =
            (
                ROAD_RTILES_X - 1
            ) / 2;


        for(
            let x = 0;
            x < ROAD_RTILES_X;
            x++
        ){

            const current =
                sourceHeight[y][x];


            /*
                --------------------------------------------
                LONGITUDINAL ROAD INFLUENCE
                --------------------------------------------

                Strongest at center.
                Weakest at outer edges.
            */

            const distance =
                Math.abs(
                    x - center
                );


            const normalizedDistance =
                distance /
                center;


            const roadInfluence =
                Math.max(
                    0,
                    1 -
                    normalizedDistance
                );


            /*
                --------------------------------------------
                EDGE TRANSITION
                --------------------------------------------

                Left half transitions from
                left terrain toward road target.

                Right half transitions from
                right terrain toward road target.
            */

            let edgeTarget;


            if(
                x <= center
            ){

                const t =
                    x / center;


                edgeTarget =
                    left +
                    (
                        roadTarget -
                        left
                    ) *
                    t;

            }
            else{

                const t =
                    (
                        ROAD_RTILES_X -
                        1 -
                        x
                    ) / center;


                edgeTarget =
                    right +
                    (
                        roadTarget -
                        right
                    ) *
                    t;

            }


            /*
                Combine road target and edge
                transition.
            */

            const desired =
                (
                    roadTarget *
                    roadInfluence
                ) +
                (
                    edgeTarget *
                    (
                        1 -
                        roadInfluence
                    )
                );


            /*
                Apply only a portion of the
                difference.

                This is the actual height carving.
            */

            let result =
                current +
                (
                    desired -
                    current
                ) *
                ROAD_CARVE_STRENGTH;


            /*
                Optional inversion.

                This is a height inversion,
                not a road-color operation.
            */

            if(inverted){

                result =
                    255 -
                    result;

            }


            outputHeight[y][x] =
                clampHeight(
                    result
                );

        }

    }


    applyEndTransitions();

}


/*=========================================================
  TOP / BOTTOM TRANSITIONS
=========================================================*/

function applyEndTransitions(){

    /*
        One rTile is the minimum transition
        unit.

        No sub-rTile falloff is generated.
    */

    for(
        let x = 0;
        x < ROAD_RTILES_X;
        x++
    ){

        /*
            TOP
        */

        outputHeight[0][x] =
            clampHeight(

                (
                    outputHeight[0][x] +
                    getTopTerrain(x)
                ) / 2

            );


        /*
            BOTTOM
        */

        const bottomRow =
            ROAD_RTILES_Y - 1;


        outputHeight[bottomRow][x] =
            clampHeight(

                (
                    outputHeight[bottomRow][x] +
                    getBottomTerrain(x)
                ) / 2

            );

    }

}


/*=========================================================
  GENERATE
=========================================================*/

function generateRoad(){

    carveRoad();

    render();

}


/*=========================================================
  RENDER
=========================================================*/

/*
    IMPORTANT:

    Canvas pixels are presentation.

    The actual generator resolution remains:

        16 × 60 rTiles

    Each rTile is rendered as:

        64 × 32 pixels

    Therefore:

        16 × 64  = 1024
        60 × 32  = 1920
*/

function render(){

    ctx.clearRect(
        0,
        0,
        ROAD_WIDTH,
        ROAD_HEIGHT
    );


    for(
        let y = 0;
        y < ROAD_RTILES_Y;
        y++
    ){

        for(
            let x = 0;
            x < ROAD_RTILES_X;
            x++
        ){

            const value =
                outputHeight[y][x];


            ctx.fillStyle =
                `rgb(${value},${value},${value})`;


            ctx.fillRect(

                x * RTILE_WIDTH,
                y * RTILE_HEIGHT,

                RTILE_WIDTH,
                RTILE_HEIGHT

            );

        }

    }

}


/*=========================================================
  INVERT
=========================================================*/

document
.getElementById("invertBtn")
.onclick = () => {

    inverted =
        !inverted;


    document
    .getElementById("invertBtn")
    .textContent =
        inverted
            ? "Invert: ON"
            : "Invert: OFF";


    generateRoad();

};


/*=========================================================
  GENERATE BUTTON
=========================================================*/

document
.getElementById("generateBtn")
.onclick =
    generateRoad;


/*=========================================================
  EXPORT
=========================================================*/

function exportRoad(){

    /*
        Standalone height export.

        Exact usable dimensions:

            1024 × 1920

        PNG preserves the grayscale height field.
    */

    const link =
        document.createElement("a");


    link.download =
        "RoadGenerator_1024x1920.png";


    link.href =
        canvas.toDataURL(
            "image/png"
        );


    link.click();

}


document
.getElementById("exportBtn")
.onclick =
    exportRoad;


/*=========================================================
  HUB MESSAGES
=========================================================*/

window.addEventListener(
    "message",
    (e) => {

        const msg =
            e.data;


        if(!msg){
            return;
        }


        switch(msg.type){

            /*=============================================
              TERRAIN DATA
            =============================================*/

            case "SET_TERRAIN":

                if(
                    msg.payload
                ){

                    setTerrainData(
                        msg.payload
                    );

                }

                break;


            /*=============================================
              GENERATE
            =============================================*/

            case "GENERATE":

                generateRoad();

                break;


            /*=============================================
              EXPORT
            =============================================*/

            case "EXPORT":

                exportRoad();

                break;

        }

    }
);


/*=========================================================
  STANDALONE TEST TERRAIN
=========================================================*/

/*
    This fallback exists ONLY so Road Generator
    can function independently before the master
    terrain system sends real data.

    It is generated at native rTile resolution:

        16 × 60

    It is NOT a second micro-resolution.
*/

function createTestTerrain(){

    const field =
        createField(
            ROAD_RTILES_X,
            ROAD_RTILES_Y,
            128
        );


    for(
        let y = 0;
        y < ROAD_RTILES_Y;
        y++
    ){

        for(
            let x = 0;
            x < ROAD_RTILES_X;
            x++
        ){

            const longitudinal =
                Math.sin(
                    y * 0.14
                ) * 25;


            const transverse =
                Math.sin(
                    x * 0.35
                ) * 12;


            const slope =
                (
                    x /
                    (
                        ROAD_RTILES_X - 1
                    )
                ) * 20;


            field[y][x] =
                clampHeight(

                    105 +
                    longitudinal +
                    transverse +
                    slope

                );

        }

    }


    return field;

}


/*
    Initialize standalone terrain.
*/

sourceHeight =
    createTestTerrain();


/*
    Build matching surrounding edges.
*/

for(
    let y = 0;
    y < ROAD_RTILES_Y;
    y++
){

    terrainEdges.left[y] =
        sourceHeight[y][0];

    terrainEdges.right[y] =
        sourceHeight[y][
            ROAD_RTILES_X - 1
        ];

}


for(
    let x = 0;
    x < ROAD_RTILES_X;
    x++
){

    terrainEdges.top[x] =
        sourceHeight[0][x];

    terrainEdges.bottom[x] =
        sourceHeight[
            ROAD_RTILES_Y - 1
        ][x];

}


/*=========================================================
  INITIALIZE
=========================================================*/

generateRoad();


/*=========================================================
  DEBUG
=========================================================*/

console.log(
    "Road Generator Ready"
);

console.log(
    "rTile:",
    `${RTILE_WIDTH} × ${RTILE_HEIGHT}`
);

console.log(
    "p:",
    `${P_WIDTH} × ${P_HEIGHT}`
);

console.log(
    "p composition:",
    `${P_RTILES_X} × ${P_RTILES_Y} rTiles`
);

console.log(
    "Road usable space:",
    `${ROAD_RTILES_X} × ${ROAD_RTILES_Y} rTiles`
);

console.log(
    "Road pixels:",
    `${ROAD_WIDTH} × ${ROAD_HEIGHT}`
);

console.log(
    "Clipping:",
    "Anything outside 1024 × 1920 is ignored."
);

</script>

</body>
</html>
