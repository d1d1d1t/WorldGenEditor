<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Road Generator</title>

<style>

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:monospace;
}

#widget{

    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;

}

#toolbar{

    flex:0 0 44px;

    height:44px;

    background:#1a1a1a;

    border-bottom:1px solid #2b2b2b;

    display:flex;

    align-items:center;

    gap:8px;

    padding:6px;

    box-sizing:border-box;

}

button{

    background:#222;

    color:#ccc;

    border:1px solid #444;

    padding:4px 10px;

    cursor:pointer;

    font-family:monospace;

}

button:hover{
    background:#303030;
}

#status{

    margin-left:auto;

    color:#777;

    font-size:11px;

    white-space:nowrap;

}

#viewport{

    flex:1;

    min-height:0;

    min-width:0;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    background:#101010;

}

/*
    IMPORTANT:

    The canvas has a fixed native resolution.

    CSS scales the complete 1024:1920 rectangle
    proportionally.

    It can never distort the aspect ratio.
*/

canvas{

    display:block;

    width:auto;

    height:auto;

    max-width:100%;

    max-height:100%;

    aspect-ratio:1024 / 1920;

    image-rendering:pixelated;

}

</style>
</head>

<body>

<div id="widget">

    <div id="toolbar">

        <button id="generateBtn">
            Generate Road
        </button>

        <button id="invertBtn">
            Invert: OFF
        </button>

        <button id="exportBtn">
            Export
        </button>

        <span id="status">
            Road Generator | 1024 × 1920
        </span>

    </div>

    <div id="viewport">

        <canvas
            id="canvas"
            width="1024"
            height="1920">
        </canvas>

    </div>

</div>


<script type="module">

/*=========================================================
  CANVAS
=========================================================*/

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


/*=========================================================
  CANONICAL METRICS
=========================================================*/

/*
    Fundamental road unit.
*/

const RTILE_WIDTH  = 64;
const RTILE_HEIGHT = 32;


/*
    p.

        5 × 6 rTiles

        320 × 192
*/

const P_WIDTH  = 320;
const P_HEIGHT = 192;

const P_X =
    P_WIDTH /
    RTILE_WIDTH;

const P_Y =
    P_HEIGHT /
    RTILE_HEIGHT;


/*
    Road Generator usable footprint.

        1024 × 1920

        16 × 60 rTiles
*/

const ROAD_WIDTH  = 1024;
const ROAD_HEIGHT = 1920;

const ROAD_X =
    ROAD_WIDTH /
    RTILE_WIDTH;

const ROAD_Y =
    ROAD_HEIGHT /
    RTILE_HEIGHT;


/*
    Validation.
*/

if(
    ROAD_X !== 16 ||
    ROAD_Y !== 60
){

    throw new Error(
        "Road footprint must equal 16 × 60 rTiles."
    );

}


/*=========================================================
  STATE
=========================================================*/

let inverted = false;


/*=========================================================
  HEIGHT DATA
=========================================================*/

/*
    Terrain occupying the Road Generator
    footprint.

    Resolution:

        16 × 60

    Each value = one rTile.
*/

let terrain =
    createField(
        ROAD_X,
        ROAD_Y,
        128
    );


/*
    Final road height field.

    Always starts from terrain.
*/

let road =
    createField(
        ROAD_X,
        ROAD_Y,
        128
    );


/*=========================================================
  EDGE DATA
=========================================================*/

/*
    Terrain immediately adjacent to the
    four sides.

        left/right = 60 rTiles
        top/bottom = 16 rTiles
*/

let edges = {

    left:
        createArray(
            ROAD_Y,
            128
        ),

    right:
        createArray(
            ROAD_Y,
            128
        ),

    top:
        createArray(
            ROAD_X,
            128
        ),

    bottom:
        createArray(
            ROAD_X,
            128
        )

};


/*=========================================================
  HELPERS
=========================================================*/

function createArray(
    length,
    value
){

    return Array(
        length
    ).fill(value);

}


function createField(
    width,
    height,
    value
){

    return Array.from(
        {
            length:height
        },
        () =>
            Array(
                width
            ).fill(value)
    );

}


function clamp(
    value
){

    value =
        Number(value);

    if(
        !Number.isFinite(value)
    ){

        value = 128;

    }

    return Math.max(
        0,
        Math.min(
            255,
            Math.round(value)
        )
    );

}


function cloneField(
    field
){

    return field.map(
        row =>
            row.map(
                value =>
                    clamp(value)
            )
    );

}


/*=========================================================
  INPUT TERRAIN
=========================================================*/

/*
    The master terrain widget can send:

    {
        type:"SET_TERRAIN",

        payload:{
            height: [...],
            edges:{
                left: [...],
                right: [...],
                top: [...],
                bottom: [...]
            }
        }
    }

    Only the usable Road Generator space
    is consumed.

    Anything beyond it is clipped.
*/

function receiveTerrain(
    payload
){

    if(
        !payload
    ){

        return;

    }


    /*
        -----------------------------------------
        HEIGHT FIELD
        -----------------------------------------
    */

    if(
        Array.isArray(
            payload.height
        )
    ){

        for(
            let y = 0;
            y < ROAD_Y;
            y++
        ){

            if(
                !Array.isArray(
                    payload.height[y]
                )
            ){

                continue;

            }


            for(
                let x = 0;
                x < ROAD_X;
                x++
            ){

                if(
                    x <
                    payload.height[y].length
                ){

                    terrain[y][x] =
                        clamp(
                            payload.height[y][x]
                        );

                }

            }

        }

    }


    /*
        -----------------------------------------
        EDGES
        -----------------------------------------
    */

    if(
        payload.edges
    ){

        edges.left =
            copyEdge(
                payload.edges.left,
                ROAD_Y
            );

        edges.right =
            copyEdge(
                payload.edges.right,
                ROAD_Y
            );

        edges.top =
            copyEdge(
                payload.edges.top,
                ROAD_X
            );

        edges.bottom =
            copyEdge(
                payload.edges.bottom,
                ROAD_X
            );

    }


    /*
        Generate immediately after valid
        terrain input.
    */

    generateRoad();

}


/*=========================================================
  EDGE COPY
=========================================================*/

function copyEdge(
    source,
    length
){

    const result =
        createArray(
            length,
            128
        );


    if(
        !Array.isArray(source)
    ){

        return result;

    }


    for(
        let i = 0;
        i < length;
        i++
    ){

        if(
            i <
            source.length
        ){

            result[i] =
                clamp(
                    source[i]
                );

        }

    }


    return result;

}


/*=========================================================
  EDGE SAMPLING
=========================================================*/

/*
    These functions represent terrain immediately
    adjacent to the road.

    They are deliberately rTile based.
*/

function sampleLeft(y){

    return edges.left[y];

}


function sampleRight(y){

    return edges.right[y];

}


function sampleTop(x){

    return edges.top[x];

}


function sampleBottom(x){

    return edges.bottom[x];

}


/*=========================================================
  ROAD TARGET
=========================================================*/

/*
    Determine the target height for each
    longitudinal road section.

    The target is driven primarily by
    the terrain on BOTH sides.

    This is what makes the road respond
    to adjacent terrain.
*/

function roadTarget(y){

    const left =
        sampleLeft(y);

    const right =
        sampleRight(y);


    /*
        Average terrain elevation at
        the same longitudinal position.
    */

    const edgeHeight =
        (
            left +
            right
        ) / 2;


    /*
        Existing terrain at the road center.

        This prevents the road from becoming
        disconnected from its original terrain.
    */

    const centerX =
        Math.floor(
            ROAD_X / 2
        );


    const center =
        terrain[y][centerX];


    /*
        Edge data has the primary influence.
        Existing terrain supplies continuity.
    */

    return clamp(

        edgeHeight * 0.65 +
        center * 0.35

    );

}


/*=========================================================
  ROAD PROFILE
=========================================================*/

/*
    The road is not a binary mask.

    Instead it has a cross-sectional influence:

        edge
          ↓
        transition
          ↓
        road surface
          ↓
        transition
          ↓
        edge

    All changes occur per rTile.
*/

function crossSection(
    x
){

    const center =
        (
            ROAD_X - 1
        ) / 2;


    const distance =
        Math.abs(
            x - center
        );


    const normalized =
        distance /
        center;


    /*
        0 at the center.
        1 at the edge.
    */

    return Math.max(
        0,
        Math.min(
            1,
            normalized
        )
    );

}


/*=========================================================
  CARVE ROAD
=========================================================*/

function carveRoad(){

    /*
        Begin with the original terrain.

        This is essential.
    */

    road =
        cloneField(
            terrain
        );


    for(
        let y = 0;
        y < ROAD_Y;
        y++
    ){

        const target =
            roadTarget(y);


        const left =
            sampleLeft(y);

        const right =
            sampleRight(y);


        for(
            let x = 0;
            x < ROAD_X;
            x++
        ){

            const current =
                terrain[y][x];


            const profile =
                crossSection(x);


            /*
                --------------------------------------
                CENTER
                --------------------------------------

                Strong road carving.

                --------------------------------------
                EDGE
                --------------------------------------

                Strong terrain preservation.
            */

            const roadInfluence =
                1 -
                profile;


            /*
                Terrain transition target.

                Left half uses left edge.

                Right half uses right edge.
            */

            let transition;


            if(
                x <
                ROAD_X / 2
            ){

                transition =
                    left +
                    (
                        target -
                        left
                    ) *
                    roadInfluence;

            }
            else{

                transition =
                    right +
                    (
                        target -
                        right
                    ) *
                    roadInfluence;

            }


            /*
                Blend transition toward road
                center.

                This is the actual carving.
            */

            const desired =
                transition;


            /*
                Strongest in the center.
            */

            const strength =
                0.75 *
                roadInfluence;


            let value =
                current +
                (
                    desired -
                    current
                ) *
                strength;


            /*
                Optional inversion.
            */

            if(inverted){

                value =
                    255 -
                    value;

            }


            road[y][x] =
                clamp(
                    value
                );

        }

    }


    /*
        Longitudinal transitions.
    */

    applyLongitudinalTransitions();

}


/*=========================================================
  LONGITUDINAL TRANSITIONS
=========================================================*/

function applyLongitudinalTransitions(){

    /*
        Only one rTile is used at each end.

        No sub-rTile interpolation.
    */

    for(
        let x = 0;
        x < ROAD_X;
        x++
    ){

        /*
            TOP
        */

        road[0][x] =
            clamp(

                (
                    road[0][x] +
                    sampleTop(x)
                ) / 2

            );


        /*
            BOTTOM
        */

        const bottom =
            ROAD_Y - 1;


        road[bottom][x] =
            clamp(

                (
                    road[bottom][x] +
                    sampleBottom(x)
                ) / 2

            );

    }

}


/*=========================================================
  GENERATE
=========================================================*/

function generateRoad(){

    carveRoad();

    render();

}


/*=========================================================
  RENDER
=========================================================*/

function render(){

    /*
        Clear exact native canvas.
    */

    ctx.clearRect(
        0,
        0,
        ROAD_WIDTH,
        ROAD_HEIGHT
    );


    /*
        Render each native rTile.

        No smaller unit is introduced.
    */

    for(
        let y = 0;
        y < ROAD_Y;
        y++
    ){

        for(
            let x = 0;
            x < ROAD_X;
            x++
        ){

            const value =
                road[y][x];


            ctx.fillStyle =
                `rgb(${value},${value},${value})`;


            ctx.fillRect(

                x * RTILE_WIDTH,
                y * RTILE_HEIGHT,

                RTILE_WIDTH,
                RTILE_HEIGHT

            );

        }

    }

}


/*=========================================================
  EXPORT
=========================================================*/

function exportRoad(){

    const link =
        document.createElement("a");


    link.download =
        "RoadGenerator_1024x1920.png";


    link.href =
        canvas.toDataURL(
            "image/png"
        );


    link.click();

}


/*=========================================================
  BUTTONS
=========================================================*/

document
.getElementById("generateBtn")
.onclick =
    generateRoad;


document
.getElementById("exportBtn")
.onclick =
    exportRoad;


document
.getElementById("invertBtn")
.onclick =
    () => {

        inverted =
            !inverted;


        document
        .getElementById("invertBtn")
        .textContent =
            inverted
                ? "Invert: ON"
                : "Invert: OFF";


        generateRoad();

    };


/*=========================================================
  HUB COMMUNICATION
=========================================================*/

window.addEventListener(
    "message",
    event => {

        const msg =
            event.data;


        if(
            !msg
        ){

            return;

        }


        switch(
            msg.type
        ){

            case "SET_TERRAIN":

                receiveTerrain(
                    msg.payload
                );

                break;


            case "GENERATE":

                generateRoad();

                break;


            case "EXPORT":

                exportRoad();

                break;

        }

    }
);


/*=========================================================
  STANDALONE TEST TERRAIN
=========================================================*/

/*
    This allows Road Generator to operate
    independently.

    It uses ONLY native rTiles.

    16 × 60.
*/

function createTestTerrain(){

    const field =
        createField(
            ROAD_X,
            ROAD_Y,
            128
        );


    for(
        let y = 0;
        y < ROAD_Y;
        y++
    ){

        for(
            let x = 0;
            x < ROAD_X;
            x++
        ){

            const longitudinal =
                Math.sin(
                    y * 0.15
                ) * 28;


            const cross =
                Math.sin(
                    x * 0.45
                ) * 18;


            field[y][x] =
                clamp(

                    120 +
                    longitudinal +
                    cross

                );

        }

    }


    return field;

}


/*
    Only initialize fallback terrain
    if no master terrain has arrived.
*/

terrain =
    createTestTerrain();


/*
    Generate edge data from the test terrain.

    This simulates terrain immediately
    outside the Road Generator footprint.
*/

for(
    let y = 0;
    y < ROAD_Y;
    y++
){

    edges.left[y] =
        clamp(
            terrain[y][0] - 8
        );


    edges.right[y] =
        clamp(
            terrain[y][ROAD_X - 1] + 8
        );

}


for(
    let x = 0;
    x < ROAD_X;
    x++
){

    edges.top[x] =
        clamp(
            terrain[0][x]
        );


    edges.bottom[x] =
        clamp(
            terrain[ROAD_Y - 1][x]
        );

}


/*=========================================================
  INITIAL GENERATION
=========================================================*/

generateRoad();


/*=========================================================
  DEBUG
=========================================================*/

console.log(
    "Road Generator Ready"
);

console.log(
    "rTile:",
    `${RTILE_WIDTH} × ${RTILE_HEIGHT}`
);

console.log(
    "p:",
    `${P_WIDTH} × ${P_HEIGHT}`
);

console.log(
    "Road:",
    `${ROAD_WIDTH} × ${ROAD_HEIGHT}`
);

console.log(
    "Native:",
    `${ROAD_X} × ${ROAD_Y} rTiles`
);

console.log(
    "Aspect:",
    `${ROAD_WIDTH}:${ROAD_HEIGHT}`
);

</script>

</body>
</html>
