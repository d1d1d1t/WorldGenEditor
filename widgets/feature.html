<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Feature Generator</title>

<style>

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:monospace;
}

/*=========================================================
  ROOT
=========================================================*/

#widget{
    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;
}

/*=========================================================
  LOCAL TOOLBAR
=========================================================*/

#toolbar{

    height:44px;

    background:#1a1a1a;

    border-bottom:1px solid #2b2b2b;

    display:flex;

    align-items:center;

    gap:10px;

    padding:6px;

    box-sizing:border-box;

}

button{

    background:#222;

    color:#ddd;

    border:1px solid #444;

    padding:4px 10px;

    cursor:pointer;

}

button:hover{

    background:#2f2f2f;

}

label{

    color:#ccc;

    font-size:12px;

}

input[type=range]{

    width:120px;

}

#countValue{

    width:18px;

    display:inline-block;

    text-align:center;

}

/*=========================================================
  CANVAS AREA
=========================================================*/

#viewport{

    flex:1;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:hidden;

    background:#101010;

}

canvas{

    image-rendering:pixelated;

    width:100%;

    height:100%;

    object-fit:contain;

}

</style>
</head>

<body>

<div id="widget">

<div id="toolbar">

<button id="generateBtn">
Generate
</button>

<button id="exportBtn">
Export
</button>

<label>

<input
id="linked"
type="checkbox">

Linked

</label>

<label>

Features

<input
id="featureCount"
type="range"
min="1"
max="4"
value="3">

<span id="countValue">
3
</span>

</label>

</div>

<div id="viewport">

<canvas
id="canvas"
width="768"
height="576">
</canvas>

</div>

</div>

<script type="module">

/*=========================================================
  CANVAS
=========================================================*/

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

/*=========================================================
  CONSTANTS
=========================================================*/

/* workspace */

const WIDTH = 768;
const HEIGHT = 576;

/*=========================================================
  FEATURE FOOTPRINT
=========================================================*/

/*
    One feature footprint.

    The workspace is exactly:

        2 × F_WIDTH
        2 × F_HEIGHT

    therefore:

        768 / 384 = 2
        576 / 288 = 2
*/

const F_WIDTH = 384;
const F_HEIGHT = 288;

/* one eTile */

const ETILE = 16;

/* footprint resolution */

const COLS = F_WIDTH / ETILE;
const ROWS = F_HEIGHT / ETILE;

/*=========================================================
  FEATURE CELL GRID
=========================================================*/

/*
    Four possible feature cells:

        0 | 1
        --+--
        2 | 3
*/

const FEATURE_COLS =
    WIDTH / F_WIDTH;

const FEATURE_ROWS =
    HEIGHT / F_HEIGHT;

/*=========================================================
  GRAYSCALE VALUES
=========================================================*/

const VALUES = [

    26,
    52,
    77,
    102,
    128,
    166,
    210,
    255

];

/*=========================================================
  UI
=========================================================*/

const linkedBox =
document.getElementById("linked");

const slider =
document.getElementById("featureCount");

const countLabel =
document.getElementById("countValue");

let linked = false;

let featureCount =
    Number(slider.value);

linkedBox.onchange = () => {

    linked =
        linkedBox.checked;

};

slider.oninput = () => {

    featureCount =
        Number(slider.value);

    countLabel.textContent =
        featureCount;

};

/*=========================================================
  DATA
=========================================================*/

/*
    Every entry represents ONE (f)

    {
        x,
        y,
        cell,
        data
    }
*/

let features = [];

/*=========================================================
  RANDOM VALUE
=========================================================*/

function randomValue(){

    return VALUES[
        Math.floor(
            Math.random() *
            VALUES.length
        )
    ];

}

/*=========================================================
  STRUCTURAL (f) GENERATOR
=========================================================*/

function buildF(){

    const total =
        COLS * ROWS;

    /*=====================================================
      OCCUPANCY TARGET
    =====================================================*/

    const targetDensity =
        0.22 +
        Math.random() * 0.18;

    const targetCount =
        Math.floor(
            total *
            targetDensity
        );

    /*=====================================================
      GRID OCCUPANCY
    =====================================================*/

    const grid =
        new Array(total).fill(0);

    /*=====================================================
      SEED NEAR CENTER
    =====================================================*/

    const startX =
        Math.floor(COLS / 2);

    const startY =
        Math.floor(ROWS / 2);

    function idx(x,y){

        return y * COLS + x;

    }

    function inBounds(x,y){

        return (
            x >= 0 &&
            y >= 0 &&
            x < COLS &&
            y < ROWS
        );

    }

    function neighbors(x,y){

        return [

            [x + 1,y],
            [x - 1,y],
            [x,y + 1],
            [x,y - 1]

        ];

    }

    /*=====================================================
      START SEED
    =====================================================*/

    let frontier = [

        [startX,startY]

    ];

    grid[
        idx(startX,startY)
    ] = 1;

    let count = 1;

    /*=====================================================
      GROW CLUSTER
    =====================================================*/

    while(
        frontier.length &&
        count < targetCount
    ){

        const i =
            Math.floor(
                Math.random() *
                frontier.length
            );

        const [
            x,
            y
        ] = frontier[i];

        const n =
            neighbors(x,y);

        /*
            Randomize growth direction.
        */

        n.sort(
            () => Math.random() - 0.5
        );

        for(
            const [nx,ny] of n
        ){

            if(
                !inBounds(nx,ny)
            ){

                continue;

            }

            const id =
                idx(nx,ny);

            if(
                grid[id] === 0 &&
                Math.random() > 0.35
            ){

                grid[id] = 1;

                frontier.push([
                    nx,
                    ny
                ]);

                count++;

                if(
                    count >= targetCount
                ){

                    break;

                }

            }

        }

        /*=================================================
          RANDOM FRONTIER PRUNING
        =================================================*/

        if(
            Math.random() > 0.7
        ){

            frontier.splice(
                i,
                1
            );

        }

    }

    /*=====================================================
      ASSIGN VALUES AFTER STRUCTURE EXISTS
    =====================================================*/

    const data =
        grid.map(v => {

            if(v === 0){

                return 0;

            }

            return randomValue();

        });

    return {

        cols: COLS,
        rows: ROWS,
        data

    };

}

/*=========================================================
  FEATURE CELL POSITION
=========================================================*/

function cellPosition(cell){

    const cellX =
        cell % FEATURE_COLS;

    const cellY =
        Math.floor(
            cell / FEATURE_COLS
        );

    return {

        x:
            cellX * F_WIDTH,

        y:
            cellY * F_HEIGHT

    };

}

/*=========================================================
  CELL NEIGHBORS
=========================================================*/

function cellNeighbors(cell){

    const cellX =
        cell % FEATURE_COLS;

    const cellY =
        Math.floor(
            cell / FEATURE_COLS
        );

    const result = [];

    /* left */

    if(cellX > 0){

        result.push(
            cell - 1
        );

    }

    /* right */

    if(
        cellX <
        FEATURE_COLS - 1
    ){

        result.push(
            cell + 1
        );

    }

    /* up */

    if(cellY > 0){

        result.push(
            cell - FEATURE_COLS
        );

    }

    /* down */

    if(
        cellY <
        FEATURE_ROWS - 1
    ){

        result.push(
            cell + FEATURE_COLS
        );

    }

    return result;

}

/*=========================================================
  SHUFFLE
=========================================================*/

function shuffle(array){

    for(
        let i = array.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [
            array[i],
            array[j]
        ] = [
            array[j],
            array[i]
        ];

    }

    return array;

}

/*=========================================================
  CHOOSE FEATURE CELLS
=========================================================*/

function chooseCells(){

    /*
        Four exact (f) cells exist:

            0 | 1
            --+--
            2 | 3
    */

    const cells = [];

    /*=====================================================
      FIRST FEATURE
    =====================================================*/

    const firstCell =
        Math.floor(
            Math.random() * 4
        );

    cells.push(firstCell);

    /*=====================================================
      LINKED MODE
    =====================================================*/

    if(linked){

        while(
            cells.length <
            featureCount
        ){

            const candidates = [];

            /*
                Find all unoccupied cells
                adjacent to the current cluster.
            */

            for(
                const cell of cells
            ){

                const neighbors =
                    cellNeighbors(cell);

                for(
                    const neighbor
                    of neighbors
                ){

                    if(
                        !cells.includes(
                            neighbor
                        ) &&
                        !candidates.includes(
                            neighbor
                        )
                    ){

                        candidates.push(
                            neighbor
                        );

                    }

                }

            }

            if(
                candidates.length === 0
            ){

                break;

            }

            const selected =
                candidates[
                    Math.floor(
                        Math.random() *
                        candidates.length
                    )
                ];

            cells.push(selected);

        }

        return cells;

    }

    /*=====================================================
      UNLINKED MODE
    =====================================================*/

    const remaining = [

        0,
        1,
        2,
        3

    ].filter(
        cell =>
            !cells.includes(cell)
    );

    shuffle(remaining);

    while(
        cells.length <
        featureCount
    ){

        cells.push(
            remaining.shift()
        );

    }

    return cells;

}

/*=========================================================
  GENERATE
=========================================================*/

function generate(){

    features = [];

    const cells =
        chooseCells();

    for(
        const cell of cells
    ){

        const position =
            cellPosition(cell);

        features.push({

            x:
                position.x,

            y:
                position.y,

            cell:
                cell,

            data:
                buildF()

        });

    }

}

/*=========================================================
  RENDER
=========================================================*/

function render(){

    /*=====================================================
      CLEAR WORKSPACE
    =====================================================*/

    ctx.fillStyle =
        "#000";

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );

    /*=====================================================
      RENDER EACH FEATURE
    =====================================================*/

    for(
        const feature
        of features
    ){

        const f =
            feature.data;

        for(
            let i = 0;
            i < f.data.length;
            i++
        ){

            const value =
                f.data[i];

            /*
                Zero = empty.
            */

            if(value === 0){

                continue;

            }

            const ex =
                i % f.cols;

            const ey =
                Math.floor(
                    i / f.cols
                );

            const px =
                feature.x +
                ex * ETILE;

            const py =
                feature.y +
                ey * ETILE;

            ctx.fillStyle =
                `rgb(${value},${value},${value})`;

            ctx.fillRect(

                px,
                py,
                ETILE,
                ETILE

            );

        }

    }

}

/*=========================================================
  EXPORT
=========================================================*/

function exportFeature(){

    /*
        Standalone export.

        Exact canvas dimensions:

            768 × 576

        PNG preserves the generated
        grayscale values without
        JPEG compression.
    */

    const link =
        document.createElement("a");

    link.download =
        "feature_768x576.png";

    link.href =
        canvas.toDataURL(
            "image/png"
        );

    link.click();

}

/*=========================================================
  REGENERATE
=========================================================*/

function regenerate(){

    generate();

    render();

}

/*=========================================================
  UI
=========================================================*/

document
.getElementById("generateBtn")
.onclick =
    regenerate;

document
.getElementById("exportBtn")
.onclick =
    exportFeature;

/*=========================================================
  HUB MESSAGES
=========================================================*/

window.addEventListener(
    "message",
    (e) => {

        const msg =
            e.data;

        if(!msg){

            return;

        }

        switch(msg.type){

            case "INIT":

                regenerate();

                break;

            case "GENERATE":

                regenerate();

                break;

            case "EXPORT":

                exportFeature();

                break;

            case "FEATURE_ZOOM":

                if(
                    msg.payload?.zoom
                ){

                    canvas.style.transform =
                        `scale(${msg.payload.zoom})`;

                }

                break;

        }

    }
);

/*=========================================================
  INITIALIZE
=========================================================*/

featureCount =
    Number(
        slider.value
    );

linked =
    linkedBox.checked;

regenerate();

console.log(
    "Feature Generator Ready"
);

</script>

</body>
</html>
